<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Left half of a heart pointing straight up from origin (0,0) to center cleft (0,-80) -->
    <path id="heart-left-half" d="M 0,0 C -22,-18 -44,-42 -44,-62 C -44,-78 -30,-90 -14,-90 C -6,-90 0,-85 0,-78 Z" />
    <!-- Right half of a heart pointing straight up from center cleft (0,-78) to origin (0,0) -->
    <path id="heart-right-half" d="M 0,-78 C 0,-85 6,-90 14,-90 C 30,-90 44,-78 44,-62 C 44,-42 22,-18 0,0 Z" />
  </defs>

  <g transform="translate(100, 100)">
    <!-- Top Petal (Green) -->
    <g>
      <use href="#heart-left-half" fill="#1eb053" />
      <use href="#heart-right-half" fill="#0d7338" />
    </g>

    <!-- Right Petal (Blue/Cyan) - Rotated 90 deg -->
    <g transform="rotate(90)">
      <use href="#heart-left-half" fill="#1bbaf5" />
      <use href="#heart-right-half" fill="#0077b6" />
    </g>

    <!-- Bottom Petal (Yellow/Orange) - Rotated 180 deg -->
    <g transform="rotate(180)">
      <use href="#heart-left-half" fill="#f5c400" />
      <use href="#heart-right-half" fill="#e67e00" />
    </g>

    <!-- Left Petal (Pink/Red) - Rotated 270 deg -->
    <g transform="rotate(270)">
      <use href="#heart-left-half" fill="#ff6b6b" />
      <use href="#heart-right-half" fill="#c83214" />
    </g>
  </g>
</svg>
